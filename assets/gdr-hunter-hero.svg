<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="GDR Hunter illustration showing a phone capturing a to-let board">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f4"/><stop offset="1" stop-color="#f9f1df"/></linearGradient>

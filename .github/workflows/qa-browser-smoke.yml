name: GDR Free Browser Smoke Tests

on:
  push:
    branches:
      - "main"
      - "fix/full-qa-20261020"
      - "feature/gdr-master-platform-20261104"
      - "fix/find-home-pin-search-smooth-20261104"
      - "fix/gdr-nearby-radius-guard-20261104"
      - "codex/ghardekho-rental-management"
      - "codex/fix-property-card-actions"
      - "codex/fix-saved-card-native-handlers"
      - "codex/fix-details-nearby-property-rpc"
      - "codex/allow-visit-before-admin-verification"
      - "feature/owner-command-center-20261105"
      - "fix/back-dashboard-file-picker-20261107"
      - "fix/free-osm-property-studio-20261107"
    paths:
      - "index.html"
      - "admin/**"
      - "assets/**"
      - "tests/**"
      - "playwright.config.cjs"
      - ".github/workflows/qa-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdr-free-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only responsive smoke tests
        run: npx playwright test tests/

name: GDR Free Browser Smoke Tests

on:
  workflow_run:
    workflows: ["Deploy GharDekho to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdr-free-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only responsive and production-load diagnostics
        run: npx playwright test tests/

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdr-browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

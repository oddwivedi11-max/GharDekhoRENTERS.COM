name: Deploy GharDekho to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Inject final renter search assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="/assets/ghardekho-polish.css">'
          js = '<script defer src="/assets/gdr-renter-location-autocomplete.js"></script>'
          if css not in s:
              s = s.replace("</head>", f"    {css}\n</head>", 1)
          if js not in s:
              s = s.replace("</head>", f"    {js}\n</head>", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

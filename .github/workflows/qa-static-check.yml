name: GDR QA Static Checks

on:
  push:
    branches:
      - "main"
      - "fix/gdr-prod-recovery-analytics-20261110"
      - "fix/gdr-location-safe-drafts-cloudflare-verify-20261110"
      - "feature/gdr-master-followup-final-20261109"
      - "fix/gdr-pin-location-safety-20261109"
      - "fix/full-qa-20261020"
      - "feature/gdr-master-platform-20261104"
      - "fix/find-home-pin-search-smooth-20261104"
      - "fix/gdr-nearby-radius-guard-20261104"
      - "codex/ghardekho-rental-management"
      - "codex/fix-property-card-actions"
      - "codex/fix-saved-card-native-handlers"
      - "codex/fix-details-nearby-property-rpc"
      - "codex/allow-visit-before-admin-verification"
      - "feature/owner-command-center-20261105"
      - "fix/owner-workspace-complete-functional-audit-20261105"
      - "fix/owner-ui-navigation-visibility-20261105"
      - "fix/back-dashboard-file-picker-20261107"
      - "fix/free-osm-property-studio-20261107"
      - "fix/owner-dashboard-gallery-performance-20261109"
      - "fix/gdr-map-voice-ai-20261107"
      - "fix/gdr-map-voice-ai-20261107b"
      - "fix/gdr-renter-search-accuracy-20261107c"
      - "fix/hindi-voice-search-singrauli-20261107"
      - "fix/map-viewport-browse-markers-20261107"
      - "fix/map-list-full-results-mobile"
      - "fix/hindi-bhopal-patel-nagar-search-20261107b"
      - "fix/singrauli-location-only-search"
      - "fix/gdr-voice-autosearch-and-analytics"
      - "fix/gdr-fresh-voice-search-and-transcript-dedupe"
      - "fix/clear-visible-renter-filters-on-new-voice-search"
      - "fix/assistant-property-results-render-and-cache-bust"
      - "hotfix/prevent-owner-counter-observer-loop-20261105"
      - "hotfix/versioned-owner-command-loader-20261105"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdr-qa-static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply idempotent frontend safety patches
        run: |
          python3 scripts/patch-owner-dashboard-refresh.py
          python3 scripts/patch-property-studio.py

      - name: Check committed diff formatting
        run: git show --check --oneline HEAD || echo "::warning::Whitespace warnings detected in the latest commit; continuing with JavaScript syntax checks."

      - name: Parse inline JavaScript in public and admin pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          targets = [Path("index.html"), Path("admin/control.html")]
          out = Path(".qa-inline-js")
          out.mkdir(exist_ok=True)
          total = 0

          for target in targets:
              source = target.read_text(encoding="utf-8")
              matches = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", source, flags=re.I | re.S)
              count = 0
              for attrs, body in matches:
                  if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                      continue
                  type_match = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, flags=re.I)
                  script_type = type_match.group(1).lower() if type_match else "text/javascript"
                  if script_type not in ("text/javascript", "application/javascript", "module"):
                      continue
                  suffix = "mjs" if script_type == "module" else "js"
                  path = out / f"{target.stem}-{count:03d}.{suffix}"
                  path.write_text(body, encoding="utf-8")
                  count += 1
              print(f"{target}: extracted {count} inline JavaScript blocks")
              if count == 0:
                  raise SystemExit(f"No inline JavaScript found in {target}")
              total += count

          print(f"Total inline JavaScript blocks: {total}")
          PY

          find .qa-inline-js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check standalone frontend modules
        run: |
          node --check assets/gdr-pincode-search.js
          node --check assets/gdr-map-experience.js
          node --check assets/gdr-map-voice.js
          node --check tests/gdr-map-voice.test.cjs
          node --test tests/gdr-map-voice.test.cjs
          node --check assets/gdr-renter-experience.js
          node --test tests/gdr-renter-experience.test.cjs
          PYTHONPYCACHEPREFIX=/tmp/gdr-pycache python3 -m py_compile scripts/patch-owner-dashboard-refresh.py scripts/patch-property-studio.py
          node --check assets/gdr-property-studio.js
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-rental-suite-v2.js
          node --test tests/gdr-property-studio.test.cjs
          node --check tests/gdr-property-studio-voice.test.cjs
          node --test tests/gdr-property-studio-voice.test.cjs
          node --check tests/gdr-property-studio-pincode.test.cjs
          node --test tests/gdr-property-studio-pincode.test.cjs
          node --test tests/gdr-renter-moveout-notice.test.cjs
          node --test tests/gdr-role-portal-switch.spec.cjs
          node --test tests/gdr-role-enablement.test.cjs
          node --check assets/gdr-owner-renter-editor.js
          node --check assets/gdr-owner-renter-page.js
          node --check assets/gdr-owner-current-renters-dashboard.js
          node --check assets/gdr-owner-command-center.js
          node --check assets/gdr-owner-command-center-hotfix.js
          node --check assets/gdr-owner-payments.js
          node --check tests/gdr-owner-workspace-functional.test.cjs
          node --test tests/gdr-owner-workspace-functional.test.cjs
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --check tests/gdr-owner-counter-observer-regression.test.cjs
          node --test tests/gdr-owner-counter-observer-regression.test.cjs
          node --check tests/gdr-owner-renter-page.test.cjs
          node --test tests/gdr-owner-renter-page.test.cjs
          node --check tests/gdr-property-workflows.test.cjs
          node --test tests/gdr-property-workflows.test.cjs
          node --check tests/gdr-owner-renter-map.spec.cjs
          node --test tests/gdr-owner-renter-map.spec.cjs
          node --test tests/gdr-admin-layout.test.cjs
          node --check tests/gdr-map-experience.spec.cjs
          node --check tests/gdr-nearby-preservation.spec.cjs
          node --check tests/gdr-role-switch-navigation.test.cjs
          node --test tests/gdr-role-switch-navigation.test.cjs

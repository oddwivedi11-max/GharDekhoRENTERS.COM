name: GDR Account and Static Audit

on:
  push:
    branches:
      - "fix/gdr-role-and-audit-20261025"
      - "fix/signup-confirmation-20261025"
    paths:
      - "index.html"
      - "admin/**"
      - "tests/**"
      - ".github/workflows/gdr-account-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdr-account-audit
  cancel-in-progress: true

jobs:
  account-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run account-role regression tests
        run: node --test tests/*.test.cjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only browser audit
        run: npx playwright test tests/

      - name: Parse inline JavaScript in public and admin pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          out = Path(".qa-inline-js")
          out.mkdir(exist_ok=True)
          total = 0
          for target in [Path("index.html"), Path("admin/control.html")]:
              source = target.read_text(encoding="utf-8")
              matches = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", source, flags=re.I | re.S)
              count = 0
              for attrs, body in matches:
                  if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                      continue
                  type_match = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, flags=re.I)
                  script_type = type_match.group(1).lower() if type_match else "text/javascript"
                  if script_type not in ("text/javascript", "application/javascript", "module"):
                      continue
                  suffix = "mjs" if script_type == "module" else "js"
                  (out / f"{target.stem}-{count:03d}.{suffix}").write_text(body, encoding="utf-8")
                  count += 1
              if count == 0:
                  raise SystemExit(f"No inline JavaScript found in {target}")
              print(f"{target}: {count} inline JavaScript blocks")
              total += count
          print(f"Total inline JavaScript blocks: {total}")
          PY
          find .qa-inline-js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

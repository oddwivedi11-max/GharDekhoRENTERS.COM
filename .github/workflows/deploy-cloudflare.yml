name: Deploy GharDekho to Cloudflare Workers

# Trigger a fresh deployment of the current main branch.
# Manual redeploys can be started from the Actions tab via workflow_dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply owner dashboard refresh fix
        run: python3 scripts/patch-owner-dashboard-refresh.py

      - name: Commit corrected index.html back to main
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix owner dashboard property refresh"
            git push origin HEAD:main
          else
            echo "index.html already contains the owner dashboard fix."
          fi

      - name: Deploy static site with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy

name: Deploy GharDekho to Cloudflare Workers

# Trigger a fresh deployment of the current main branch.
# Manual redeploys can be started from the Actions tab via workflow_dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply owner dashboard and Property Studio fixes
        run: |
          python3 scripts/patch-owner-dashboard-refresh.py
          python3 scripts/patch-property-studio.py
          python3 scripts/patch-renter-dashboard-ui.py

      - name: Version the GDR voice and map assets in the production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          assets = [
              ("gdr-renter-experience.js", "20261107-compare-picker2"),
              ("gdr-renter-experience.css", "20261107-compare-picker2"),
              ("gdr-rental-suite-v2.js", "20261107-dashboardui1"),
              ("gdr-map-experience.js", "20261107-map-compare-button1"),
          ]
          for asset, version in assets:
              pattern = r'(/assets/' + re.escape(asset) + r')(?:\?v=[^"\s>]*)?'
              source, count = re.subn(pattern, lambda match: match.group(1) + "?v=" + version, source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely version existing asset: " + asset)
          path.write_text(source, encoding="utf-8")
          print("Updated GDR voice and map assistant cache versions.")
          PY

      - name: Commit corrected index.html back to main
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html tests/gdr-renter-experience.test.cjs
            git commit -m "Apply renter dashboard UI refinement"
            git push origin HEAD:main
          else
            echo "index.html already contains the owner dashboard fix."
          fi

      - name: Validate owner Nearby map modules
        run: |
          PYTHONPYCACHEPREFIX=/tmp/gdr-pycache python3 -m py_compile scripts/patch-owner-dashboard-refresh.py scripts/patch-property-studio.py
          node --check assets/gdr-property-studio.js
          node --test tests/gdr-property-studio-voice.test.cjs
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-rental-suite-v2.js
          node --test tests/gdr-property-studio.test.cjs
          node --test tests/gdr-renter-moveout-notice.test.cjs
          node --test tests/gdr-role-portal-switch.spec.cjs
          node --test tests/gdr-role-switch-navigation.test.cjs
          node --test tests/gdr-role-enablement.test.cjs
          node --check assets/gdr-map-experience.js
          node --check assets/gdr-map-voice.js
          node --test tests/gdr-map-voice.test.cjs
          node --check assets/gdr-renter-experience.js
          node --test tests/gdr-renter-experience.test.cjs
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-owner-command-center-hotfix.js
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --check assets/gdr-owner-current-renters-dashboard.js
          node --check assets/gdr-owner-renter-page.js
          node --check assets/gdr-owner-payments.js
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-dashboard-navigation.test.cjs
          node --test tests/gdr-owner-workspace-functional.test.cjs
          node --test tests/gdr-owner-renter-page.test.cjs
          node --test tests/gdr-owner-nearby-map.test.cjs
          node --test tests/gdr-pincode-search.test.cjs
          node --test tests/gdr-admin-layout.test.cjs

      - name: Deploy static site with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy

      - name: Verify deployed production assets
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          BASE_URL="https://ghardekhorenters-com.od-dwivedi11.workers.dev"
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/" -o /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/login" -o /tmp/gdr-live-login.html
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-login.html
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-index.html
          grep -q 'gdr-map-experience.js?v=20261107-map-compare-button1' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-experience.js" -o /tmp/gdr-map-experience.js
          grep -q 'GDRMapExperience' /tmp/gdr-map-experience.js
          grep -q 'const rent=Number(p.rent||0),short=money(rent)' /tmp/gdr-map-experience.js
          grep -q 'fitBounds(coordinates,{padding:\[48,48\],maxZoom:15,animate:false})' /tmp/gdr-map-experience.js
          grep -q 'SATELLITE_URL' /tmp/gdr-map-experience.js
          grep -q 'radiusBounds(state.searchCenter)' /tmp/gdr-map-experience.js
          grep -q 'searchRenterArea(undefined,true)' /tmp/gdr-map-experience.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-experience.css" -o /tmp/gdr-map-experience.css
          grep -q 'gdr-map-shell' /tmp/gdr-map-experience.css
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-voice.js?v=20261107-map-voice5" -o /tmp/gdr-map-voice.js
          grep -q 'GDRMapVoiceAssistant' /tmp/gdr-map-voice.js
          grep -q 'Available Rental Properties below' /tmp/gdr-map-voice.js
          grep -q 'const VERSION="20261107-map-voice5"' /tmp/gdr-map-voice.js
          grep -q 'const VERSION="20261107-map-voice5"' /tmp/gdr-map-voice.js
          grep -q 'assistant.searchAssistantListings({...state.prefs,location},raw,target)' /tmp/gdr-map-voice.js
          grep -q 'assistant.searchAssistantListings({...state.prefs,location},raw,target)' /tmp/gdr-map-voice.js
          grep -q 'gdr-map-voice-mic-icon' /tmp/gdr-map-voice.js
          grep -q 'gdrMapVoiceResults' /tmp/gdr-map-voice.js
          grep -q 'gdr-map-voice-mic-icon' /tmp/gdr-map-voice.js
          grep -q 'gdrMapVoiceResults' /tmp/gdr-map-voice.js
          grep -q 'r.continuous=false' /tmp/gdr-map-voice.js
          grep -q 'setTimeout(finishTurn,450)' /tmp/gdr-map-voice.js
          grep -q 'const final=String(state.finalText||"").trim()' /tmp/gdr-map-voice.js
          grep -q 'if(!current)state.finalText=spoken' /tmp/gdr-map-voice.js
          grep -q 'prefs={...state.prefs}' /tmp/gdr-map-voice.js
          if grep -q 'setTimeout(finishTurn,1800)' /tmp/gdr-map-voice.js; then echo 'Legacy slow interim speech finalizer is still present.'; exit 1; fi
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-voice.css?v=20261107-map-ux4" -o /tmp/gdr-map-voice.css
          grep -q 'gdr-map-voice-mic' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant .gdr-map-voice-head h3' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant .gdr-map-voice-mic' /tmp/gdr-map-voice.css
          grep -q 'leaflet-control-layers' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant.gdr-map-voice{' /tmp/gdr-map-voice.css
          grep -q 'background:#FFF9EF!important' /tmp/gdr-map-voice.css
          grep -q 'color:#173F35!important' /tmp/gdr-map-voice.css
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-renter-experience.js?v=20261107-compare-picker2" -o /tmp/gdr-renter-experience.js
          grep -q 'get_public_properties' /tmp/gdr-renter-experience.js
          grep -q 'PUBLIC_INVENTORY_TTL_MS=20000' /tmp/gdr-renter-experience.js
          grep -q 'function warmPublicInventory()' /tmp/gdr-renter-experience.js
          grep -q 'const inventory=await loadPublicInventory()' /tmp/gdr-renter-experience.js
          grep -q 'window.renderVoicePropertyResults(rows)' /tmp/gdr-renter-experience.js
          grep -q 'Available Rental Properties below' /tmp/gdr-renter-experience.js
          grep -q 'const hindiCityLead=clean.match' /tmp/gdr-renter-experience.js
          if grep -q 'toolbar.appendChild(w)' /tmp/gdr-renter-experience.js; then echo 'Duplicate legacy map microphone is still present.'; exit 1; fi
          grep -q 'Tell GDR What Home' /tmp/gdr-renter-experience.js
          grep -q 'toggleCompare' /tmp/gdr-renter-experience.js
          grep -q 'GDR_COMPARE_AUTOFILL_V2' /tmp/gdr-renter-experience.js
          grep -q 'r.continuous=false' /tmp/gdr-renter-experience.js
          grep -q 'review(finalText,{autoSearch:true})' /tmp/gdr-renter-experience.js
          grep -Fq 'review($("gdrxPrompt").value,{autoSearch:true})' /tmp/gdr-renter-experience.js
          grep -Fq 'section.scrollIntoView({behavior:window.matchMedia' /tmp/gdr-renter-experience.js
          grep -q 'speakAssistantReply(spokenReply,replyLanguage)' /tmp/gdr-renter-experience.js
          grep -q 'state.voiceDraft=finalTranscript.trim()' /tmp/gdr-renter-experience.js
          grep -q 'Chrome speech recognition could not reach its speech service' /tmp/gdr-renter-experience.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-renter-experience.css?v=20261107-compare-picker2" -o /tmp/gdr-renter-experience.css
          grep -q 'gdrx-finder' /tmp/gdr-renter-experience.css
          grep -q 'FINAL ACCEPTANCE FIX: three distinct renter dashboard identities' /tmp/gdr-renter-experience.css
          grep -q 'background:linear-gradient(135deg,#fffdf7 0%,#f7f0e2 58%,#efe4cf 100%)' /tmp/gdr-renter-experience.css
          grep -q 'gdr-renter-experience.js?v=20261107-compare-picker2' /tmp/gdr-live-index.html
          grep -q 'gdr-renter-dashboard-visual-fix-v4' /tmp/gdr-live-index.html
          grep -q '<strong>Explore Nearby</strong>' /tmp/gdr-live-index.html
          grep -q 'gdrRenterPaymentsAction' /tmp/gdr-live-index.html
          grep -q 'gdrxSupport' /tmp/gdr-live-index.html
          grep -q 'gdr-rental-suite-v2.js?v=20261107-dashboardui1' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-command-center-hotfix.js?v=20261107-workspace7' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-renter-page.js?v=20261107-workspace4' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-payments.js?v=20261107-brandfix1' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-current-renters-dashboard.js?v=20261107-workspace4' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-payments.css?v=20261107-brandfix1' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-command-center-hotfix.js?v=20261107-workspace7" -o /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'function setTextIfChanged' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'data-gdr-module="nearby"' /tmp/gdr-owner-command-center-hotfix.js && { echo "Duplicate Nearby Homes shortcut still present."; exit 1; } || true
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-renter-page.js?v=20261107-workspace4" -o /tmp/gdr-owner-renter-page.js
          grep -q 'Additional charges could not be loaded' /tmp/gdr-owner-renter-page.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-payments.js?v=20261107-paytitle3" -o /tmp/gdr-owner-payments.js
          grep -q 'gdrPayAddCharge' /tmp/gdr-owner-payments.js
          grep -q 'gdr-pay-header--minimal' /tmp/gdr-owner-payments.js
          grep -q 'GDR PAYMENT' /tmp/gdr-owner-payments.js
          if grep -q 'GDR FINANCE / OWNER WORKSPACE' /tmp/gdr-owner-payments.js; then echo 'Redundant finance heading still present'; exit 1; fi
          grep -q 'occupancy_charges' /tmp/gdr-owner-payments.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-current-renters-dashboard.js?v=20261107-workspace4" -o /tmp/gdr-owner-current-renters-dashboard.js
          grep -q 'previousBodyOverflow' /tmp/gdr-owner-current-renters-dashboard.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-command-center.css?v=20261107-workspace7" -o /tmp/gdr-owner-command-center.css
          grep -q '#e8d18a' /tmp/gdr-owner-command-center.css
          grep -q '#f8fff4' /tmp/gdr-owner-command-center.css
          grep -q '#e8f0ea' /tmp/gdr-owner-command-center.css
          grep -q '#b9f36b' /tmp/gdr-owner-command-center.css
          grep -q 'workspace7' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'gdrOccModuleTitle' /tmp/gdr-owner-command-center.css
          grep -q 'grid-template-columns:112px minmax(0,1fr)' /tmp/gdr-owner-command-center.css
          grep -q 'function bindLogout' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'removeAttribute("onclick")' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'window.addEventListener("click"' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'data-gd-open-property-picker' /tmp/gdr-live-index.html
          grep -q 'gdPickerAuthorized' /tmp/gdr-live-index.html
          grep -q 'List Your Property' /tmp/gdr-live-index.html
          grep -q 'gdr-property-studio.js?v=20261107-voiceassistant3' /tmp/gdr-live-index.html
          grep -q 'gdr-property-studio.css?v=20261107-voiceassistant1' /tmp/gdr-live-index.html
          grep -q 'gdr-rental-suite-v2.js?v=20261107-dashboardui1' /tmp/gdr-live-index.html
          grep -q 'href="/assets/gdr-rental-suite.css"' /tmp/gdr-live-index.html
          if grep -q 'id="dashboardRoleSwitch"' /tmp/gdr-live-index.html; then echo 'Dashboard role switch UI still present'; exit 1; fi
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-property-studio.js?v=20261107-voiceassistant3" -o /tmp/gdr-property-studio.js
          grep -q 'owner_publish_property_studio' /tmp/gdr-property-studio.js
          grep -q 'continuous=false' /tmp/gdr-property-studio.js
          grep -q 'interimResults=true' /tmp/gdr-property-studio.js
          grep -q 'processVoiceTurn' /tmp/gdr-property-studio.js
          grep -q 'function applyVoiceValues' /tmp/gdr-property-studio.js
          grep -q 'String(state.voice.turnText||"").trim()' /tmp/gdr-property-studio.js
          if grep -q 'scheduleVoiceRestart' /tmp/gdr-property-studio.js; then echo 'Automatic owner microphone restart still present.'; exit 1; fi
          grep -q 'speechSynthesis' /tmp/gdr-property-studio.js
          grep -q 'SpeechRecognition' /tmp/gdr-property-studio.js
          grep -q 'gdr-renter-experience.js?v=20261107-compare-picker2' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-property-studio.css?v=20261107-voiceassistant1" -o /tmp/gdr-property-studio.css
          grep -q 'gdr-studio-topbar' /tmp/gdr-property-studio.css
          grep -q 'gdr-studio-voice-assistant' /tmp/gdr-property-studio.css
          grep -q 'gdr-moveout-notice' /tmp/gdr-property-studio.css
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-property-studio.txt?v=20261107-voiceassistant3" -o /tmp/gdr-property-studio.html
          grep -q 'data-gdr-property-type="room"' /tmp/gdr-property-studio.html
          grep -q 'Microphone is OFF by default' /tmp/gdr-property-studio.html
          grep -q 'gdrStudioPhotoFiles' /tmp/gdr-property-studio.html
          grep -q 'gdrStudioVoiceAssistant' /tmp/gdr-property-studio.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-rental-suite-v2.js?v=20261107-dashboardui1" -o /tmp/gdr-rental-suite.js
          grep -q 'renter_submit_move_out_notice' /tmp/gdr-rental-suite.js
          # The payment module has its own independently versioned dynamic stylesheet;
          # the payment JS and the new Property Studio assets are verified above.
          echo "Cloudflare worker, map, owner dashboard, renter profile, payments and responsive styles are responding."

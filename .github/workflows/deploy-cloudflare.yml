name: Deploy GharDekho to Cloudflare Workers

# Trigger a fresh deployment of the current main branch.
# Manual redeploys can be started from the Actions tab via workflow_dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply owner dashboard refresh fix
        run: python3 scripts/patch-owner-dashboard-refresh.py

      - name: Commit corrected index.html back to main
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix owner dashboard property refresh"
            git push origin HEAD:main
          else
            echo "index.html already contains the owner dashboard fix."
          fi

      - name: Validate owner Nearby map modules
        run: |
          PYTHONPYCACHEPREFIX=/tmp/gdr-pycache python3 -m py_compile scripts/patch-owner-dashboard-refresh.py
          node --check assets/gdr-map-experience.js
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-owner-command-center-hotfix.js
          node --check assets/gdr-owner-current-renters-dashboard.js
          node --check assets/gdr-owner-renter-page.js
          node --check assets/gdr-owner-payments.js
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-dashboard-navigation.test.cjs
          node --test tests/gdr-owner-workspace-functional.test.cjs
          node --test tests/gdr-owner-renter-page.test.cjs
          node --test tests/gdr-owner-nearby-map.test.cjs
          node --test tests/gdr-pincode-search.test.cjs
          node --test tests/gdr-admin-layout.test.cjs

      - name: Deploy static site with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy

      - name: Verify deployed production assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ghardekhorenters-com.od-dwivedi11.workers.dev"
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/" -o /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/login" -o /tmp/gdr-live-login.html
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-login.html
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-experience.js" -o /tmp/gdr-map-experience.js
          grep -q 'GDRMapExperience' /tmp/gdr-map-experience.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-experience.css" -o /tmp/gdr-map-experience.css
          grep -q 'gdr-map-shell' /tmp/gdr-map-experience.css
          grep -q 'gdr-owner-command-center-hotfix.js?v=20261105-workspace3' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-renter-page.js?v=20261105-workspace3' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-payments.js?v=20261105-workspace3' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-current-renters-dashboard.js?v=20261105-workspace3' /tmp/gdr-live-index.html
          grep -q 'gdr-owner-payments.css?v=20261105-workspace3' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-command-center-hotfix.js?v=20261105-workspace3" -o /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'function setTextIfChanged' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'data-gdr-module="nearby"' /tmp/gdr-owner-command-center-hotfix.js && { echo "Duplicate Nearby Homes shortcut still present."; exit 1; } || true
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-renter-page.js?v=20261105-workspace3" -o /tmp/gdr-owner-renter-page.js
          grep -q 'Additional charges could not be loaded' /tmp/gdr-owner-renter-page.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-payments.js?v=20261105-workspace3" -o /tmp/gdr-owner-payments.js
          grep -q 'gdrPayAddCharge' /tmp/gdr-owner-payments.js
          grep -q 'occupancy_charges' /tmp/gdr-owner-payments.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-current-renters-dashboard.js?v=20261105-workspace3" -o /tmp/gdr-owner-current-renters-dashboard.js
          grep -q 'previousBodyOverflow' /tmp/gdr-owner-current-renters-dashboard.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-command-center.css?v=20261105-workspace3" -o /tmp/gdr-owner-command-center.css
          grep -q '#c8f169' /tmp/gdr-owner-command-center.css
          grep -q 'gdrOccModuleTitle' /tmp/gdr-owner-command-center.css
          grep -q 'grid-template-columns:112px minmax(0,1fr)' /tmp/gdr-owner-command-center.css
          grep -q 'function bindLogout' /tmp/gdr-owner-command-center-hotfix.js
          grep -q 'removeAttribute("onclick")' /tmp/gdr-owner-command-center-hotfix.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-owner-payments.css?v=20261105-workspace3" -o /tmp/gdr-owner-payments.css
          grep -q 'gdr-pay-charge-modal' /tmp/gdr-owner-payments.css
          echo "Cloudflare worker, map, owner dashboard, renter profile, payments and responsive styles are responding."

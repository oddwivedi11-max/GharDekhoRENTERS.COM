name: Deploy GharDekho to Cloudflare Workers

# Trigger a fresh deployment of the current main branch.
# Manual redeploys can be started from the Actions tab via workflow_dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply owner dashboard and Property Studio fixes
        run: |
          python3 scripts/patch-owner-dashboard-refresh.py
          python3 scripts/patch-property-studio.py
          python3 scripts/patch-renter-dashboard-ui.py

      - name: Version the GDR voice and map assets in the production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          assets = [
              ("gdr-renter-experience.js", "20261111-infinite-scroll1"),
              ("gdr-renter-experience.css", "20261107-compare-picker2"),
              ("gdr-rental-suite-v2.js", "20261107-paymentproof1"),
              ("gdr-owner-payments.js", "20261111-paginated-records1"),
              ("gdr-owner-payments.css", "20261107-paymentproof1"),
              ("gdr-owner-renter-page.js", "20261109-renter-actions-functional1"),
              ("gdr-map-experience.js", "20261109-open-data-map-geo1"),
              ("gdr-property-studio.js", "20261110-review-panel-markup1"),
              ("gdr-property-studio.css", "20261109-draft-gallery2"),
              ("gdr-owner-property-archive.js", "20261109-soft-archive1"),
          ]
          for asset, version in assets:
              pattern = r'(/assets/' + re.escape(asset) + r')(?:\?v=[^"\s>]*)?'
              source, count = re.subn(pattern, lambda match: match.group(1) + "?v=" + version, source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely version existing asset: " + asset)
          path.write_text(source, encoding="utf-8")
          print("Updated GDR voice and map assistant cache versions.")
          PY

      - name: Commit corrected index.html back to main
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html tests/gdr-renter-experience.test.cjs
            git commit -m "Apply renter dashboard UI refinement"
            git push origin HEAD:main
          else
            echo "index.html already contains the owner dashboard fix."
          fi

      - name: Validate owner Nearby map modules
        run: |
          PYTHONPYCACHEPREFIX=/tmp/gdr-pycache python3 -m py_compile scripts/patch-owner-dashboard-refresh.py scripts/patch-property-studio.py
          node --check assets/gdr-property-studio.js
          node --test tests/gdr-property-studio-voice.test.cjs
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-rental-suite-v2.js
          node --test tests/gdr-property-studio.test.cjs
          node --test tests/gdr-renter-moveout-notice.test.cjs
          node --test tests/gdr-role-portal-switch.spec.cjs
          node --test tests/gdr-role-switch-navigation.test.cjs
          node --test tests/gdr-role-enablement.test.cjs
          node --check assets/gdr-map-experience.js
          node --check assets/gdr-map-voice.js
          node --test tests/gdr-map-voice.test.cjs
          node --check assets/gdr-renter-experience.js
          node --test tests/gdr-renter-experience.test.cjs
          node --check assets/gdr-rental-suite.js
          node --check assets/gdr-owner-command-center-hotfix.js
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --check assets/gdr-owner-current-renters-dashboard.js
          node --check assets/gdr-owner-renter-page.js
          node --check assets/gdr-owner-payments.js
          node --test tests/gdr-smart-rent-payment.test.cjs
          node --check tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-ui-navigation-regression.test.cjs
          node --test tests/gdr-owner-dashboard-navigation.test.cjs
          node --test tests/gdr-owner-workspace-functional.test.cjs
          node --test tests/gdr-owner-renter-page.test.cjs
          node --test tests/gdr-owner-nearby-map.test.cjs
          node --check assets/gdr-property-studio.js
          node --check assets/gdr-owner-property-archive.js
          node --test tests/gdr-property-studio-pincode.test.cjs
          node --test tests/gdr-owner-property-archive.test.cjs
          node --test tests/gdr-renter-promotional-banner.test.cjs
          node --test tests/gdr-pincode-search.test.cjs
          node --test tests/gdr-admin-layout.test.cjs
          node --check assets/gdr-admin-command-center.js
          node --test tests/gdr-admin-command-center.test.cjs

      - name: Confirm production deployment target
        run: echo "Deploying commit $GITHUB_SHA to Cloudflare Workers"

      - name: Deploy static site with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy

      - name: Purge stale GharDekho HTML cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          zone_response="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=ghardekhorenters.com&account.id=$CF_ACCOUNT_ID")"
          zone_id="$(printf '%s' "$zone_response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",[{}])[0].get("id","") if d.get("success") and len(d.get("result",[])) == 1 else "")')"
          if [[ -z "$zone_id" ]]; then
            echo "::error::Could not resolve exactly one ghardekhorenters.com zone. Check Zone Read permission and zone scope on CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          purge_payload='{"files":["https://ghardekhorenters.com/","https://ghardekhorenters.com/index.html","https://ghardekhorenters.com/login"]}'
          purge_response="$(curl --silent --show-error --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$purge_payload")"
          if ! printf '%s' "$purge_response" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'; then
            echo "::error::Cloudflare rejected the targeted HTML cache purge. Check Zone Cache Purge permission and zone scope on CLOUDFLARE_API_TOKEN."
            printf '%s\n' "$purge_response"
            exit 1
          fi
          echo "Cloudflare accepted a targeted cache purge for the GharDekho root, index and login HTML URLs."

      - name: Verify deployed production assets
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          VERIFIED_BASE_URL=""
          for candidate in "https://ghardekhorenters.com" "https://ghardekhorenters-com.od-dwivedi11.workers.dev"; do
            echo "Checking deployed HTML on $candidate"
            if ! curl --retry 3 --retry-delay 2 --retry-connrefused -H "Cache-Control: no-cache" -H "Pragma: no-cache" -fsS "$candidate/?__gdr_verify=$GITHUB_SHA" -o /tmp/gdr-live-root.html; then
              continue
            fi
            if ! curl --retry 3 --retry-delay 2 --retry-connrefused -H "Cache-Control: no-cache" -H "Pragma: no-cache" -fsS "$candidate/index.html?__gdr_verify=$GITHUB_SHA" -o /tmp/gdr-live-index.html; then
              continue
            fi
            if ! curl --retry 3 --retry-delay 2 --retry-connrefused -H "Cache-Control: no-cache" -H "Pragma: no-cache" -fsS "$candidate/login?__gdr_verify=$GITHUB_SHA" -o /tmp/gdr-live-login.html; then
              continue
            fi
            if grep -q 'gdr-owner-command-center-hotfix.js?v=20261111-paginated-insights1' /tmp/gdr-live-root.html \
              || grep -q 'gdr-owner-command-center-hotfix.js?v=20261111-paginated-insights1' /tmp/gdr-live-index.html \
              || grep -q 'gdr-owner-command-center-hotfix.js?v=20261111-paginated-insights1' /tmp/gdr-live-login.html; then
              if grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-root.html \
                || grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-index.html \
                || grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-login.html; then
                VERIFIED_BASE_URL="$candidate"
                break
              fi
              echo "The owner assets are current but renter HTML is stale on $candidate; trying the next origin."
            else
              echo "Required Owner Command Center asset version was not found on $candidate."
            fi
          done
          if [[ -z "$VERIFIED_BASE_URL" ]]; then
            echo "Neither the custom domain nor workers.dev returned the expected Owner Command Center asset version."
            exit 1
          fi
          BASE_URL="$VERIFIED_BASE_URL"

          # Verify the new Admin Command Center bundles, not only legacy assets.
          curl --retry 5 --retry-delay 3 --retry-connrefused -H "Cache-Control: no-cache" -fsS "$BASE_URL/assets/gdr-admin-command-center.js?v=20261110-commandcenter1" -o /tmp/gdr-admin-command-center.js
          grep -q 'GDRAdminCommandCenter' /tmp/gdr-admin-command-center.js
          grep -q 'admin_get_command_center_stats' /tmp/gdr-admin-command-center.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -H "Cache-Control: no-cache" -fsS "$BASE_URL/assets/gdr-admin-command-center.css?v=20261110-commandcenter1" -o /tmp/gdr-admin-command-center.css
          grep -q 'gdr-cc-kpi-grid' /tmp/gdr-admin-command-center.css
          grep -q 'gdr-cc-support-launch' /tmp/gdr-admin-command-center.css
          grep -q 'gdr-admin-command-center.js?v=20261110-commandcenter1' /tmp/gdr-live-root.html || grep -q 'gdr-admin-command-center.js?v=20261110-commandcenter1' /tmp/gdr-live-index.html || grep -q 'gdr-admin-command-center.js?v=20261110-commandcenter1' /tmp/gdr-live-login.html
          grep -q 'gdr-admin-command-center.css?v=20261110-commandcenter1' /tmp/gdr-live-root.html || grep -q 'gdr-admin-command-center.css?v=20261110-commandcenter1' /tmp/gdr-live-index.html || grep -q 'gdr-admin-command-center.css?v=20261110-commandcenter1' /tmp/gdr-live-login.html
          echo "Verified live Admin Command Center JavaScript, CSS and HTML references."

          echo "Verified Cloudflare production origin: $BASE_URL"
          echo "Live renter assistant script references (root / index):"
          # Root may be routed through a Worker response that omits the static script tag.
          # The canonical index.html response is the authoritative asset manifest.
          grep -oE 'gdr-renter-experience.js[^" ]*' /tmp/gdr-live-root.html | sed -n '1,3p' || true
          grep -oE 'gdr-renter-experience.js[^" ]*' /tmp/gdr-live-index.html | sed -n '1,3p' || true
          grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-root.html || grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-index.html
          # Final production acceptance requires the custom domain to serve the new HTML as well.
          curl --retry 5 --retry-delay 3 --retry-connrefused -H "Cache-Control: no-cache" -H "Pragma: no-cache" -fsS "https://ghardekhorenters.com/?__gdr_custom_verify=$GITHUB_SHA" -o /tmp/gdr-custom-root.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -H "Cache-Control: no-cache" -H "Pragma: no-cache" -fsS "https://ghardekhorenters.com/index.html?__gdr_custom_verify=$GITHUB_SHA" -o /tmp/gdr-custom-index.html
          if ! grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-custom-root.html && ! grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-custom-index.html; then
            echo "Custom production domain still serves stale renter HTML after the targeted cache purge."
            exit 1
          fi
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-login.html
          grep -q 'gdr-map-experience.js' /tmp/gdr-live-login.html || grep -q 'gdr-map-experience.js' /tmp/gdr-live-root.html || grep -q 'gdr-map-experience.js' /tmp/gdr-live-index.html
          echo "Live map script reference:"
          grep -oE 'gdr-map-experience.js[^"]*' /tmp/gdr-live-login.html | head -5
          grep -q 'gdr-map-experience.js?v=20261109-open-data-map-geo1' /tmp/gdr-live-login.html || grep -q 'gdr-map-experience.js?v=20261109-open-data-map-geo1' /tmp/gdr-live-root.html || grep -q 'gdr-map-experience.js?v=20261109-open-data-map-geo1' /tmp/gdr-live-index.html
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-experience.js" -o /tmp/gdr-map-experience.js
          grep -q 'GDRMapExperience' /tmp/gdr-map-experience.js
          grep -q 'const rent=Number(p.rent||0),short=money(rent)' /tmp/gdr-map-experience.js
          grep -q 'fitBounds(coordinates,{padding:\[48,48\],maxZoom:15,animate:false})' /tmp/gdr-map-experience.js
          grep -q 'tiles.openfreemap.org/styles/liberty' /tmp/gdr-map-experience.js
          grep -q 'OVERPASS_ENDPOINTS' /tmp/gdr-map-experience.js
          grep -q 'www.mapillary.com/app/' /tmp/gdr-map-experience.js
          grep -q 'rankPhotonFeatures' /tmp/gdr-map-experience.js
          grep -q 'radiusBounds(state.searchCenter)' /tmp/gdr-map-experience.js
          grep -q 'searchRenterArea(undefined,true)' /tmp/gdr-map-experience.js
          grep -q 'sortBrowseInventoryForList' /tmp/gdr-map-experience.js
          grep -q 'renderMarkers(rows,origin,false,true,listRows)' /tmp/gdr-map-experience.js
          grep -q 'Contact / request visit' /tmp/gdr-map-experience.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -H "Cache-Control: no-cache" -fsS "$BASE_URL/assets/gdr-map-experience.css" -o /tmp/gdr-map-experience.css
          grep -q 'gdr-map-shell' /tmp/gdr-map-experience.css
          grep -q 'gdr-map-list-actions' /tmp/gdr-map-experience.css
          grep -q 'gdr-map-explore-control' /tmp/gdr-map-experience.css
          grep -q 'gdr-poi-marker' /tmp/gdr-map-experience.css
          # Verify the owner Start Listing controller and its fresh cache key,
          # not merely that the old dashboard HTML responds.
          echo "Live Property Studio script references:"
          grep -oE 'gdr-property-studio.js[^" ]*' /tmp/gdr-live-root.html | head -3 || true
          grep -oE 'gdr-property-studio.js[^" ]*' /tmp/gdr-live-index.html | head -3 || true
          grep -oE 'gdr-property-studio.js[^" ]*' /tmp/gdr-live-login.html | head -3 || true
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-property-studio.js?v=20261110-review-panel-markup1" -o /tmp/gdr-property-studio.js
          grep -q 'bindPropertyStudioLauncher();' /tmp/gdr-property-studio.js
          grep -q 'function showLauncherFeedback(text,tone)' /tmp/gdr-property-studio.js
          grep -q 'dash.getBoundingClientRect()' /tmp/gdr-property-studio.js
          grep -q 'gdrListPropertyStart,#gdrListPropertySpeak,#ownerAddPropertyBtn' /tmp/gdr-property-studio.js
          grep -Fq 'window.addEventListener("click",function(event){' /tmp/gdr-property-studio.js
          grep -Fq 'Opening Property Studio…' /tmp/gdr-property-studio.js
          grep -Fq 'setAttribute("aria-busy","true")' /tmp/gdr-property-studio.js
          if grep -q 'getAttribute("aria-hidden")!=="true"' /tmp/gdr-property-studio.js; then
            echo "Stale aria-hidden launcher guard is still present."
            exit 1
          fi
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-property-studio.css?v=20261109-draft-gallery2" -o /tmp/gdr-property-studio.css
          grep -q 'gdrListPropertyFeedback' /tmp/gdr-property-studio.css
          grep -q 'gdr-list-hero-copy' /tmp/gdr-property-studio.css
          grep -q 'gdr-list-hero-actions' /tmp/gdr-property-studio.css
          grep -Fq '$("[data-gdr-photo-category]").forEach' /tmp/gdr-property-studio.js
          grep -Fq '$("[data-gdr-photo-category]",root).forEach' /tmp/gdr-property-studio.js
          if grep -Eq '(^|[^$])\$\("\[data-gdr-photo-category\]"\)\.forEach' /tmp/gdr-property-studio.js; then
            echo "A single-element querySelector is still used as a photo-category collection."
            exit 1
          fi
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-voice.js?v=20261107-map-voice7" -o /tmp/gdr-map-voice.js
          grep -q 'GDRMapVoiceAssistant' /tmp/gdr-map-voice.js
          grep -q 'Available Rental Properties below' /tmp/gdr-map-voice.js
          grep -q 'const VERSION="20261107-map-voice7"' /tmp/gdr-map-voice.js
          grep -q 'const VERSION="20261107-map-voice7"' /tmp/gdr-map-voice.js
          grep -q 'assistant.searchAssistantListings({...state.prefs,location},raw,target)' /tmp/gdr-map-voice.js
          grep -q 'assistant.searchAssistantListings({...state.prefs,location},raw,target)' /tmp/gdr-map-voice.js
          grep -q 'gdr-map-voice-mic-icon' /tmp/gdr-map-voice.js
          grep -q 'gdrMapVoiceResults' /tmp/gdr-map-voice.js
          grep -q 'gdr-map-voice-mic-icon' /tmp/gdr-map-voice.js
          grep -q 'gdrMapVoiceResults' /tmp/gdr-map-voice.js
          grep -q 'r.continuous=false' /tmp/gdr-map-voice.js
          grep -q 'setTimeout(finishTurn,450)' /tmp/gdr-map-voice.js
          grep -q 'const final=String(state.finalText||"").trim()' /tmp/gdr-map-voice.js
          grep -q 'if(!current)state.finalText=spoken' /tmp/gdr-map-voice.js
          grep -q 'prefs={...state.prefs}' /tmp/gdr-map-voice.js
          if grep -q 'setTimeout(finishTurn,1800)' /tmp/gdr-map-voice.js; then echo 'Legacy slow interim speech finalizer is still present.'; exit 1; fi
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-map-voice.css?v=20261107-map-ux4" -o /tmp/gdr-map-voice.css
          grep -q 'gdr-map-voice-mic' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant .gdr-map-voice-head h3' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant .gdr-map-voice-mic' /tmp/gdr-map-voice.css
          grep -q 'leaflet-control-layers' /tmp/gdr-map-voice.css
          grep -q '#gdrMapVoiceAssistant.gdr-map-voice{' /tmp/gdr-map-voice.css
          grep -q 'background:#FFF9EF!important' /tmp/gdr-map-voice.css
          grep -q 'color:#173F35!important' /tmp/gdr-map-voice.css
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-renter-experience.js?v=20261111-infinite-scroll1" -o /tmp/gdr-renter-experience.js
          grep -q 'search_public_properties_for_assistant' /tmp/gdr-renter-experience.js
          grep -q 'p_limit:pageSize' /tmp/gdr-renter-experience.js
          grep -q 'p_offset:offset' /tmp/gdr-renter-experience.js
          grep -q 'function loadMore(button)' /tmp/gdr-renter-experience.js
          grep -q 'new window.IntersectionObserver' /tmp/gdr-renter-experience.js
          grep -q 'rootMargin:"0px 0px 480px 0px"' /tmp/gdr-renter-experience.js
          if grep -Eq 'get_public_properties|warmPublicInventory' /tmp/gdr-renter-experience.js; then echo 'Legacy page-load inventory prefetch is still present.'; exit 1; fi
          grep -q 'window.renderVoicePropertyResults(loadedRows)' /tmp/gdr-renter-experience.js
          grep -q 'Available Rental Properties below' /tmp/gdr-map-voice.js
          grep -q 'const hindiCityLead=clean.match' /tmp/gdr-renter-experience.js
          if grep -q 'toolbar.appendChild(w)' /tmp/gdr-renter-experience.js; then echo 'Duplicate legacy map microphone is still present.'; exit 1; fi
          grep -q 'Tell GDR What Home' /tmp/gdr-renter-experience.js
          grep -q 'toggleCompare' /tmp/gdr-renter-experience.js
          grep -q 'GDR_COMPARE_AUTOFILL_V2' /tmp/gdr-renter-experience.js
          grep -q 'r.continuous=false' /tmp/gdr-renter-experience.js
          grep -q 'review(finalText,{autoSearch:true})' /tmp/gdr-renter-experience.js
          grep -Fq 'review($("gdrxPrompt").value,{autoSearch:true})' /tmp/gdr-renter-experience.js
          grep -Fq 'section.scrollIntoView({behavior:window.matchMedia' /tmp/gdr-renter-experience.js
          grep -q 'speakAssistantReply(spokenReply,replyLanguage)' /tmp/gdr-renter-experience.js
          grep -q 'state.voiceDraft=finalTranscript' /tmp/gdr-renter-experience.js
          grep -q 'const finalSegments=\[\]' /tmp/gdr-renter-experience.js
          grep -q 'previous=autoSearch?{}:(state.parsed||{})' /tmp/gdr-renter-experience.js
          grep -q 'resetKeys=(broadAllListings||broadHomes||resetLocationFilters)?' /tmp/gdr-renter-experience.js
          grep -q 'noisyCityPrefix' /tmp/gdr-renter-experience.js
          grep -q 'Chrome speech recognition could not reach its speech service' /tmp/gdr-renter-experience.js
          curl --retry 5 --retry-delay 3 --retry-connrefused -fsS "$BASE_URL/assets/gdr-renter-experience.css?v=20261107-compare-picker2" -o /tmp/gdr-renter-experience.css
          grep -q 'gdrx-finder' /tmp/gdr-renter-experience.css
          grep -q 'FINAL ACCEPTANCE FIX: three distinct renter dashboard identities' /tmp/gdr-renter-experience.css
          grep -q 'background:linear-gradient(135deg,#fffdf7 0%,#f7f0e2 58%,#efe4cf 100%)' /tmp/gdr-renter-experience.css
          grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-root.html || grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-login.html || grep -q 'gdr-renter-experience.js?v=20261111-infinite-scroll1' /tmp/gdr-live-index.html
